<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Edit Book - LibraryDesk</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav>
  <h2>LibraryDesk</h2>

  <div>
    <a href="/">Home</a>
    <a href="/books">Books</a>
    <a href="/students">Students</a>
    <a href="/issue">Issue Book</a>
    <a href="/return">Return Book</a>
    <a href="/records">Records</a>
    <a href="/login">Login</a>
  </div>
</nav>

<div class="edit-book">

  <h1>Edit Book</h1>

  <form th:action="@{/books/edit/{id}(id=${book.id})}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label>Book Title</label>
    <input type="text"
           name="title"
           th:value="${book.title}"
           required>

    <label>Author</label>
    <input type="text"
           name="author"
           th:value="${book.author}"
           required>

    <label>ISBN</label>
    <input type="text"
           name="isbn"
           th:value="${book.isbn}"
           required>

    <label>Available Copies</label>
    <input type="number"
           name="copies"
           th:value="${book.copies}"
           min="0"
           required>

    <button type="submit">Update Book</button>

  </form>

</div>

<footer>
  <h3>LibraryDesk</h3>
  <p>Making library management simple and organized.</p>

  <div>
    <a href="/">Home</a>
    <a href="/books">Books</a>
    <a href="/students">Students</a>
    <a href="/login">Login</a>
  </div>

  <p>© 2026 LibraryDesk. All rights reserved.</p>
</footer>

</body>
</html>
