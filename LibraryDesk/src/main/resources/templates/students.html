<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">

    <title>Students</title>
</head>
<body>

<nav>
    <h2>LibraryDesk</h2>

    <div>
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/students">Students</a>
        <a href="/issue">Issue Book</a>
        <a href="/return">Return Book</a>
        <a href="/records">Records</a>
        <a href="/login">Login</a>
    </div>
</nav>

 <section class ="students">
     <div th:if="${success}" class="success-message" th:text="${success}"></div>
    <h1> Students </h1>
     <p>Add a student to LibraryDesk.</p>
     <form action="/students/add" method="post">
         <label for="studentId">Student ID</label>
         <input type="number" id="studentId" name="studentId" placeholder="Enter student ID" required>
         <label for="studentName">Student Name</label>
     <input type="text" id="studentName" name="studentName" placeholder="Enter student name" required>
         <button type="submit">Add Student</button> </form>
     <h2>Registered Students</h2>

     <table>
         <tr>
             <th>Student ID</th>
             <th>Name</th>
         </tr>

         <tr th:each="student : ${students}">
             <td th:text="${student.studentId}"></td>
             <td th:text="${student.studentName}"></td>
         </tr>
     </table>


 </section>

<footer>

    <h3>LibraryDesk</h3>

    <p>Making library management simple and organized.</p>

    <div>
        <a href="/">Home</a>
        <a href="/books">Books</a>
        <a href="/students">Students</a>
        <a href="/login">Login</a>
    </div>

    <p>© 2026 LibraryDesk. All rights reserved.</p>

</footer>

</body>
</html>
